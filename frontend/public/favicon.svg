<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Gradient Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer App Icon Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- ID Card Shape -->
  <g filter="url(#shadow)">
    <rect x="10" y="14" width="44" height="36" rx="6" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Lanyard / Chip slot at top -->
    <rect x="26" y="17" width="12" height="3" rx="1.5" fill="#94A3B8" />

    <!-- Avatar Placeholder -->
    <rect x="15" y="24" width="13" height="16" rx="3" fill="#DBEAFE" />
    <!-- Avatar Head & Body -->
    <circle cx="21.5" cy="29" r="3.5" fill="#3B82F6" />
    <path d="M16.5 38 C16.5 34.5 19 33.5 21.5 33.5 C24 33.5 26.5 34.5 26.5 38 Z" fill="#3B82F6" />

    <!-- ID Data Lines (Smart Formatting Rows) -->
    <rect x="32" y="25" width="16" height="3" rx="1.5" fill="#3B82F6" />
    <rect x="32" y="31" width="12" height="2.5" rx="1.25" fill="#94A3B8" />
    <rect x="32" y="36" width="14" height="2.5" rx="1.25" fill="#CBD5E1" />

    <!-- Verified Smart Badge (Small Green Dot) -->
    <circle cx="49" cy="45" r="3.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
  </g>
</svg>
